<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Aero Track - Personalize Your Coach</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline": "#6e7881",
                    "surface-tint": "#006591",
                    "secondary-fixed": "#ffdbca",
                    "on-primary-fixed-variant": "#004c6e",
                    "on-error": "#ffffff",
                    "on-secondary-container": "#5c2400",
                    "surface-container-low": "#eff4ff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#251a00",
                    "on-surface": "#0b1c30",
                    "secondary": "#9d4300",
                    "tertiary-fixed": "#ffdf9a",
                    "secondary-container": "#fd761a",
                    "primary-fixed": "#c9e6ff",
                    "on-background": "#0b1c30",
                    "surface-variant": "#d3e4fe",
                    "surface-container-high": "#dce9ff",
                    "on-tertiary": "#ffffff",
                    "surface-bright": "#f8f9ff",
                    "inverse-on-surface": "#eaf1ff",
                    "tertiary": "#785a00",
                    "primary-fixed-dim": "#89ceff",
                    "on-surface-variant": "#3e4850",
                    "primary-container": "#0ea5e9",
                    "background": "#f8f9ff",
                    "tertiary-container": "#c39400",
                    "error": "#ba1a1a",
                    "surface-container": "#e5eeff",
                    "outline-variant": "#bec8d2",
                    "inverse-primary": "#89ceff",
                    "on-secondary-fixed": "#341100",
                    "tertiary-fixed-dim": "#f7be1d",
                    "error-container": "#ffdad6",
                    "on-primary-fixed": "#001e2f",
                    "surface": "#f8f9ff",
                    "inverse-surface": "#213145",
                    "on-tertiary-fixed-variant": "#5a4300",
                    "on-primary-container": "#003751",
                    "on-error-container": "#93000a",
                    "surface-dim": "#cbdbf5",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#d3e4fe",
                    "primary": "#006591",
                    "on-tertiary-container": "#423000",
                    "secondary-fixed-dim": "#ffb690",
                    "on-secondary-fixed-variant": "#783200",
                    "on-primary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "24px",
                    "gutter": "16px",
                    "md": "16px",
                    "container-padding": "20px",
                    "xl": "32px",
                    "base": "4px",
                    "xs": "4px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "mono-stats": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "mono-stats": ["20px", {"lineHeight": "24px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .backdrop-blur-glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        input:focus { outline: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top AppBar - Suppressed Navigation Shell for Transactional Onboarding -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl flex items-center px-container-padding h-16">
<button aria-label="Go back" class="p-sm -ml-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
</header>
<main class="pt-24 pb-12 px-container-padding min-h-screen flex flex-col gap-xl max-w-md mx-auto">
<!-- Header Section -->
<section class="flex flex-col gap-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Let's Personalize Your Coach</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We use your stats to customize your AI plan. All data stays local.</p>
</section>
<!-- Stats Card (Floating Glassmorphism Card) -->
<section class="bg-white rounded-[20px] p-lg shadow-[0px_10px_25px_rgba(0,0,0,0.04)] flex flex-col gap-lg border border-outline-variant/10">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-outline tracking-wider uppercase">YOUR PHYSICAL STATS</span>
<div class="flex bg-surface-container rounded-full p-1">
<button class="px-4 py-1.5 rounded-full text-label-sm font-label-sm bg-white shadow-sm text-primary transition-all">Male</button>
<button class="px-4 py-1.5 rounded-full text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface transition-colors">Female</button>
</div>
</div>
<!-- Height Input -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant">Height</label>
<div class="flex gap-2 text-label-sm font-label-sm text-outline">
<span class="text-primary font-bold">CM</span>
<span class="opacity-30">|</span>
<span class="">FT</span>
</div>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">straighten</span>
<input class="w-full bg-[#F8FAFC] border-none focus:ring-2 focus:ring-primary-container rounded-xl pl-12 pr-4 py-4 font-mono-stats text-mono-stats text-on-surface" placeholder="180" type="number">
</div>
</div>
<!-- Weight Input -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant">Weight</label>
<div class="flex gap-2 text-label-sm font-label-sm text-outline">
<span class="text-primary font-bold">KG</span>
<span class="opacity-30">|</span>
<span class="">LBS</span>
</div>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">scale</span>
<input class="w-full bg-[#F8FAFC] border-none focus:ring-2 focus:ring-primary-container rounded-xl pl-12 pr-4 py-4 font-mono-stats text-mono-stats text-on-surface" placeholder="75.0" type="number">
</div>
</div>
</section>
<!-- Account Details -->
<section class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<input class="w-full bg-[#F8FAFC] border-none focus:ring-2 focus:ring-primary-container rounded-xl px-4 py-4 font-body-md text-body-md text-on-surface transition-all placeholder:text-outline-variant" placeholder="Email Address" type="email">
</div>
<div class="flex flex-col gap-xs">
<input class="w-full bg-[#F8FAFC] border-none focus:ring-2 focus:ring-primary-container rounded-xl px-4 py-4 font-body-md text-body-md text-on-surface transition-all placeholder:text-outline-variant" placeholder="Create Password" type="password">
</div><div class="flex flex-col gap-xs"><input class="w-full bg-[#F8FAFC] border-none focus:ring-2 focus:ring-primary-container rounded-xl px-4 py-4 font-body-md text-body-md text-on-surface transition-all placeholder:text-outline-variant" placeholder="Confirm Password" type="password"></div>
<div class="flex items-start gap-sm px-1 py-2">
<div class="relative flex items-center mt-0.5">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded-md border-2 border-outline-variant transition-all checked:border-primary-container checked:bg-primary-container focus:outline-none" id="terms" type="checkbox">
<span class="material-symbols-outlined absolute left-0 text-white opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none text-sm scale-75">check</span>
</div>
<label class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed" for="terms">
                    I agree to the <span class="text-primary font-bold">Terms &amp; Conditions</span> and acknowledge the Privacy Policy regarding my local data.
                </label>
</div>
</section>
<!-- Action Button -->
<section class="mt-auto flex flex-col gap-lg text-center">
<button class="w-full bg-primary-container py-4 rounded-xl text-on-primary font-label-md text-label-md shadow-[0px_8px_20px_rgba(14,165,233,0.25)] active:scale-95 transition-all duration-200">
                Create Account
            </button>
<p class="font-label-md text-label-md text-on-surface-variant">
                Already have an account? <a class="text-primary-container font-bold hover:underline transition-all" href="#">Log In</a>
</p>
</section>
<!-- AI Integration Visual Hint (Atmospheric Decor) -->
<div class="fixed bottom-0 left-0 w-full h-1/4 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute bottom-[-100px] left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-primary-container/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-50px] right-[-50px] w-[200px] h-[200px] bg-tertiary-container/5 blur-[80px] rounded-full"></div>
</div>
</main>
<script>
        // Simple micro-interaction for the gender toggle
        const toggleButtons = document.querySelectorAll('.bg-surface-container button');
        toggleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                toggleButtons.forEach(b => {
                    b.classList.remove('bg-white', 'shadow-sm', 'text-primary');
                    b.classList.add('text-on-surface-variant');
                });
                btn.classList.add('bg-white', 'shadow-sm', 'text-primary');
                btn.classList.remove('text-on-surface-variant');
            });
        });

        // Simple input focus behavior for visual depth
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.relative')?.querySelector('.material-symbols-outlined')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.closest('.relative')?.querySelector('.material-symbols-outlined')?.classList.remove('text-primary');
            });
        });
    </script>


</body></html>
