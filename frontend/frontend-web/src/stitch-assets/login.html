<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Aero Track - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .spatial-card {

        }
        .glow-button {
            box-shadow: 0px 8px 20px rgba(14, 165, 233, 0.25);
        }
        .ai-glow {
            box-shadow: 0px 0px 20px rgba(14, 165, 233, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
            -webkit-tap-highlight-color: transparent;
        }
    </style>

          theme: {
            extend: {
              "colors": {
                      "outline": "#6e7881",
                      "surface-tint": "#006591",
                      "secondary-fixed": "#ffdbca",
                      "on-primary-fixed-variant": "#004c6e",
                      "on-error": "#ffffff",
                      "on-secondary-container": "#5c2400",
                      "surface-container-low": "#eff4ff",
                      "surface-container-lowest": "#ffffff",

                      "secondary": "#9d4300",

                      "primary-fixed": "#c9e6ff",
                      "on-background": "#0b1c30",

                      "tertiary": "#785a00",
                      "primary-fixed-dim": "#89ceff",
                      "on-surface-variant": "#3e4850",
                      "primary-container": "#0ea5e9",
                      "background": "#f8f9ff",
                      "tertiary-container": "#c39400",
                      "error": "#ba1a1a",
                      "surface-container": "#e5eeff",
                      "outline-variant": "#bec8d2",
                      "inverse-primary": "#89ceff",
                      "on-secondary-fixed": "#341100",
                      "tertiary-fixed-dim": "#f7be1d",
                      "error-container": "#ffdad6",
                      "on-primary-fixed": "#001e2f",
                      "surface": "#f8f9ff",
                      "inverse-surface": "#213145",
                      "on-tertiary-fixed-variant": "#5a4300",
                      "on-primary-container": "#003751",
                      "on-error-container": "#93000a",
                      "surface-dim": "#cbdbf5",
                      "on-secondary": "#ffffff",
                      "surface-container-highest": "#d3e4fe",

                      "on-tertiary-container": "#423000",
                      "secondary-fixed-dim": "#ffb690",
                      "on-secondary-fixed-variant": "#783200",
                      "on-primary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "lg": "24px",
                      "gutter": "16px",
                      "md": "16px",
                      "container-padding": "20px",
                      "xl": "32px",
                      "base": "4px",
                      "xs": "4px",
                      "sm": "8px"

              "fontFamily": {
                      "body-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-md": ["Inter"],

                      "mono-stats": ["Inter"],

<body class="flex flex-col min-h-screen items-center justify-center bg-surface-container-lowest">
<!-- Main Content Canvas -->
<main class="w-full max-w-[440px] px-container-padding flex flex-col items-center animate-fade-in">
<!-- Logo Section -->
<div class="mb-xl mt-md">
<div class="w-16 h-16 bg-primary-container/10 rounded-[20px] flex items-center justify-center ai-glow border border-primary-container/20">
<span class="font-display-lg text-primary-container select-none">A</span>
</div>
</div>
<!-- Header -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Ready to hit today's targets?</p>
</div>
<!-- Form Section -->
<form class="w-full space-y-md" onsubmit="return false;">
<!-- Email Input -->
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<input class="w-full bg-[#F8FAFC] border-0 rounded-full py-4 pl-12 pr-6 font-body-md text-body-md text-on-surface ring-2 ring-transparent focus:ring-primary-container focus:bg-white transition-all outline-none" placeholder="Email Address" type="email">
</div>
<!-- Password Input -->
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<input class="w-full bg-[#F8FAFC] border-0 rounded-full py-4 pl-12 pr-12 font-body-md text-body-md text-on-surface ring-2 ring-transparent focus:ring-primary-container focus:bg-white transition-all outline-none" id="password-input" placeholder="Password" type="password">
<button class="absolute inset-y-0 right-4 flex items-center text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
<div class="flex justify-end px-2">
<button class="font-label-md text-label-md text-primary-container hover:opacity-80 transition-opacity" type="button">Forgot Password?</button>
</div>
<!-- Login Button -->
<button class="w-full bg-primary-container text-on-primary text-headline-md font-headline-md py-4 rounded-full glow-button active:scale-95 transition-all duration-200 mt-md">
                Log In
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-xl gap-md">
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Or continue with</span>
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-md w-full">
<button class="flex items-center justify-center gap-sm bg-white border border-outline-variant/20 py-3 rounded-full spatial-card hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#000"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#000"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#000"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#000"></path></svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-sm bg-white border border-outline-variant/20 py-3 rounded-full spatial-card hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<svg class="w-5 h-5 mb-0.5" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.96.95-2.22 1.72-3.72 1.72-1.45 0-2.2-.84-3.55-.84-1.37 0-2.18.84-3.57.84-1.4 0-2.65-.77-3.66-1.77C.6 18.28-.9 14.1.85 10.8c.87-1.63 2.53-2.65 4.34-2.65 1.37 0 2.45.82 3.25.82s1.88-.82 3.25-.82c1.55 0 2.92.76 3.75 1.75-3.04 1.4-2.55 5.5.4 6.78-.6 1.45-1.18 2.62-1.79 3.6zM13.53 5.4c.05-1.28-.46-2.55-1.3-3.48-.84-.92-2.1-1.44-3.3-1.44-.05 1.3.5 2.54 1.34 3.44.82.93 2.12 1.48 3.26 1.48z"></path></svg>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
<!-- Footer -->
<div class="mt-xl mb-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to Aura? 
                <a class="text-primary-container font-bold ml-1 hover:underline transition-all" href="#">Register Now</a>
</p>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -right-[5%] w-[400px] h-[400px] bg-primary-container/5 rounded-full blur-[80px]"></div>
<div class="absolute -bottom-[5%] -left-[10%] w-[350px] h-[350px] bg-primary-container/5 rounded-full blur-[60px]"></div>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('visibility-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add subtle parallax effect on mouse move for desktop
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                const containers = document.querySelectorAll('.spatial-card');
                containers.forEach(container => {
                    container.style.transform = `translate(${moveX}px, ${moveY}px)`;
                });
            }
        });
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>


</body></html>
